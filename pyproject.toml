[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ubot-min"
version = "0.1.0"
description = "Minimal runnable UBot reconfiguration planner"
requires-python = ">=3.9"
dependencies = [
  "numpy>=1.23",
]

[tool.setuptools.packages.find]
include = ["ubot*"]
